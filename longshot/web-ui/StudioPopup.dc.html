<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Target Studio resume pop-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #ffffff">
<dc-import name="HomeV7" variant="nine" studio="resume" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(6, 10, 16, 0.74)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-sub" style="position: absolute; left: 50%; top: 50%; width: 540px; margin: -215px 0 0 -270px; box-sizing: border-box; padding: 28px; border-radius: 20px; background: #1a2635; border: 1px solid #2c3b4d; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55)">

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div>
<h2 id="dlg-title" style="margin: 0; font-size: 20px; font-weight: 700">Resume today's session?</h2>
<div id="dlg-sub" style="margin-top: 6px; font-size: 13px; color: #8d9aab">{{summary}}</div>
</div>
<button aria-label="Close and stay on Home" title="Close (Esc)" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; border: 0; background: #243446; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 22px">
<sc-for list="{{items}}" as="t" hint-placeholder-count="4">
<div>
<div style="position: relative; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{t.bg}}"/><circle cx="50" cy="50" r="38" fill="none" stroke="{{t.line}}" stroke-width="1.6"/><circle cx="50" cy="50" r="26" fill="none" stroke="{{t.line}}" stroke-width="1.6"/><circle cx="50" cy="50" r="14" fill="none" stroke="{{t.line}}" stroke-width="1.6"/><circle cx="50" cy="50" r="6" fill="{{t.center}}"/></svg>
<sc-if value="{{t.video}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 6px; bottom: 6px; padding: 1px 6px; border-radius: 5px; background: rgba(8, 12, 18, 0.85); font-size: 10px; font-weight: 500">0:38</span>
</sc-if>
</div>
<div style="margin-top: 8px; font-size: 12px; font-weight: 600">{{t.name}}</div>
<div style="font-size: 11px; color: #8d9aab; margin-top: 1px">{{t.meta}}</div>
</div>
</sc-for>
<sc-if value="{{hasMore}}" hint-placeholder-val="{{ false }}">
<div>
<div style="aspect-ratio: 1 / 1; box-sizing: border-box; border-radius: 10px; background: #243446; border: 1px dashed #3a4c61; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 20px; font-weight: 700">+{{moreCount}}</span>
<span style="font-size: 11px; color: #8d9aab">more</span>
</div>
</div>
</sc-if>
</div>

<div style="display: flex; gap: 14px; margin-top: 26px">
<div style="flex: 1; min-width: 0">
<a href="Choosing.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #ffffff; color: #121b26; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-decoration: none">START NEW</a>
<div style="margin-top: 10px; font-size: 12px; line-height: 1.5; color: #8d9aab; text-align: center">Opens an empty selection. This session is kept until you add items.</div>
</div>
<div style="flex: 1; min-width: 0">
<a href="Choosing.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #ff5a1f; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-decoration: none; box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.28)">RESUME</a>
<div style="margin-top: 10px; font-size: 12px; line-height: 1.5; color: #8d9aab; text-align: center">Restores every source, the item order and your shot markers.</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"four","options":["four","eight"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'four';
    const all = [
      { name: 'IMG_2041', meta: 'Video · 0:38', bg: '#10151b', line: '#e8eef5', center: '#e8eef5', video: true },
      { name: 'IMG_2044', meta: 'Photo', bg: '#f1efe9', line: '#555555', center: '#d94a3a', video: false },
      { name: 'IMG_2051', meta: 'Photo', bg: '#aeb9c6', line: '#5a6675', center: '#1c232c', video: false },
      { name: 'IMG_2053', meta: 'Photo', bg: '#d8d2c4', line: '#3d3a33', center: '#d94a3a', video: false }
    ];
    if (v === 'eight') {
      return {
        items: all.slice(0, 3),
        hasMore: true, moreCount: 5,
        summary: 'Started 2:14 PM · 8 items · 21 shot markers'
      };
    }
    return {
      items: all,
      hasMore: false, moreCount: 0,
      summary: 'Started 2:14 PM · 4 items · 12 shot markers'
    };
  }
}
</script>
</body>
</html>
