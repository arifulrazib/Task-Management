<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose and Combine v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #121b26; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<nav aria-label="Primary" style="width: 72px; flex-shrink: 0; box-sizing: border-box; background: #0e1620; border-right: 1px solid #223142; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<button aria-label="{{n.label}}" title="{{n.label}}" style="{{n.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"/></svg>
</button>
</sc-for>
</nav>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #223142">
<a href="Main.dc.html" aria-label="Back to Home" style="width: 40px; height: 40px; border-radius: 50%; background: #1a2635; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div>
<div style="font-size: 12px; color: #8d9aab">Home / Target Studio</div>
<h1 style="margin: 2px 0 0; font-size: 20px; font-weight: 700">Choose &amp; Combine</h1>
</div>
</header>

<div style="flex: 1; min-height: 0; display: flex">

<aside aria-label="Library" style="width: 220px; flex-shrink: 0; box-sizing: border-box; padding: 20px 14px; border-right: 1px solid #223142; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8d9aab; padding: 0 10px 6px">LIBRARY</div>
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button style="{{f.style}}">
<span>{{f.label}}</span>
<span style="font-size: 12px; color: #8d9aab">{{f.count}}</span>
</button>
</sc-for>
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8d9aab; padding: 22px 10px 6px">ADD FROM</div>
<button style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: #ffffff; font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
Camera
</button>
</aside>

<section aria-label="Media" style="position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden">

<div style="flex-shrink: 0; box-sizing: border-box; padding: 16px 24px 12px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #223142">
<label style="display: flex; align-items: center; gap: 8px; width: 260px; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #1a2635; border: 1px solid #2c3b4d">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input type="search" placeholder="Search" aria-label="Search media" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #ffffff; font-size: 13px">
</label>
<button style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #2c3b4d; background: transparent; color: #c6d0dc; font-size: 13px; font-weight: 600; cursor: pointer">
Newest first
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 8px" title="Thumbnail size">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
<div role="slider" aria-label="Thumbnail size" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3" style="position: relative; width: 96px; height: 4px; border-radius: 2px; background: #2f4054">
<span style="position: absolute; left: 0; top: 0; width: 50%; height: 4px; border-radius: 2px; background: #8d9aab"></span>
<span style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #ffffff"></span>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16"/></svg>
</div>
<button style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #ffffff; color: #121b26; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#121b26" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
IMPORT
</button>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 0 24px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div role="group" aria-label="{{g.title}}">
<h2 style="margin: 0; padding: 18px 0 12px; font-size: 13px; font-weight: 600; color: #c6d0dc">{{g.title}} <span style="color: #8d9aab; font-weight: 500">· {{g.count}}</span></h2>
<div role="listbox" aria-label="{{g.title}}" aria-multiselectable="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 4px; margin: -4px">
<sc-for list="{{g.tiles}}" as="t" hint-placeholder-count="12">
<div role="option" aria-selected="{{t.ariaSel}}" style="{{t.wrap}}">
<button aria-label="Preview {{t.name}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: none; cursor: pointer">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{t.bg}}"/><circle cx="50" cy="50" r="40" fill="none" stroke="{{t.ring}}" stroke-width="1.4"/><circle cx="50" cy="50" r="28" fill="none" stroke="{{t.ring}}" stroke-width="1.4"/><circle cx="50" cy="50" r="16" fill="none" stroke="{{t.ring}}" stroke-width="1.4"/><circle cx="50" cy="50" r="7" fill="{{t.center}}"/><circle cx="{{t.dx}}" cy="{{t.dy}}" r="2.6" fill="{{t.dot}}"/></svg>
</button>
<sc-if value="{{t.selected}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: #ff5a1f; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; pointer-events: none">{{t.order}}</span>
</sc-if>
<sc-if value="{{t.hover}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; inset: 0; background: rgba(255, 255, 255, 0.08); pointer-events: none"></span>
<span style="position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #ffffff; background: rgba(14, 22, 32, 0.5); pointer-events: none"></span>
</sc-if>
<sc-if value="{{t.srcComputer}}" hint-placeholder-val="{{ false }}">
<span title="From computer" style="position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: rgba(8, 12, 18, 0.85); display: flex; align-items: center; justify-content: center; pointer-events: none"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/></svg></span>
</sc-if>
<sc-if value="{{t.srcCamera}}" hint-placeholder-val="{{ false }}">
<span title="From camera" style="position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: rgba(8, 12, 18, 0.85); display: flex; align-items: center; justify-content: center; pointer-events: none"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></span>
</sc-if>
<sc-if value="{{t.hasMarkers}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(8, 12, 18, 0.85); font-size: 11px; font-weight: 600; pointer-events: none"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ff8a5c" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>{{t.markers}}</span>
</sc-if>
<sc-if value="{{t.video}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; background: rgba(8, 12, 18, 0.85); font-size: 11px; font-weight: 500; pointer-events: none">{{t.duration}}</span>
</sc-if>
<sc-if value="{{t.tip}}" hint-placeholder-val="{{ false }}">
<span role="tooltip" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; padding: 6px 10px; border-radius: 8px; background: #243446; border: 1px solid #3a4c61; font-size: 12px; font-weight: 600; pointer-events: none; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5)">Maximum 8 selected</span>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ true }}">
<div role="status" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 999px; background: #1a2635; border: 1px solid #2c3b4d; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5); font-size: 13px; font-weight: 600; white-space: nowrap">
<span style="width: 20px; height: 20px; border-radius: 50%; background: rgba(61, 220, 132, 0.18); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
Session restored · 4 items · 12 shot markers
</div>
</sc-if>
</section>

<aside aria-label="Selection" style="width: 340px; flex-shrink: 0; box-sizing: border-box; border-left: 1px solid #223142; background: #0e1620; display: flex; flex-direction: column">
<div style="flex-shrink: 0; box-sizing: border-box; padding: 16px 20px 14px; display: flex; align-items: flex-start; justify-content: space-between">
<div>
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Selection</h2>
<div style="font-size: 12px; color: #8d9aab; margin-top: 1px">{{selCount}} of 8</div>
<div style="display: flex; gap: 3px; margin-top: 8px" role="img" aria-label="{{selCount}} of 8 slots used">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<span style="width: 14px; height: 5px; border-radius: 2px; background: {{s.c}}"></span>
</sc-for>
</div>
</div>
<button style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #2c3b4d; background: transparent; color: #c6d0dc; font-size: 12px; font-weight: 600; cursor: pointer">Clear all</button>
</div>

<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<sc-for list="{{tray}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; height: 64px; box-sizing: border-box; padding: 0 10px 0 6px; border-radius: 12px; background: #1a2635; flex-shrink: 0">
<span aria-hidden="true" style="width: 16px; display: flex; justify-content: center; color: #5d6c7e"><svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor"><circle cx="3" cy="3" r="1.3"/><circle cx="9" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="9" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="9" cy="13" r="1.3"/></svg></span>
<div style="position: relative; width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex-shrink: 0">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{r.bg}}"/><circle cx="50" cy="50" r="40" fill="none" stroke="{{r.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="22" fill="none" stroke="{{r.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="9" fill="{{r.center}}"/></svg>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 13px; font-weight: 600">{{r.name}}</div>
<div style="font-size: 12px; color: #8d9aab; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</div>
</div>
<span style="width: 22px; height: 22px; border-radius: 50%; background: #ff5a1f; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.order}}</span>
<button aria-label="Deselect {{r.name}}" title="Deselect" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
</sc-for>
</div>

<div style="flex-shrink: 0; box-sizing: border-box; padding: 16px; border-top: 1px solid #223142; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #8d9aab"><span>Select up to 8</span><span>Drag to reorder</span></div>
<button style="height: 48px; border-radius: 12px; border: 0; background: #ff5a1f; color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">Review {{selCount}} items</button>
</div>
</aside>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"resumed","options":["resumed","cap"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'resumed';
    const cap = v === 'cap';
    const btn = (a) => 'width: 48px; height: 48px; border-radius: 12px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + (a ? '#1f2d3d' : 'transparent');
    const items = [
      { label: 'Home', d: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z', a: false },
      { label: 'Camera', d: 'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', a: false },
      { label: 'Target Studio', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01', a: true },
      { label: 'Library', d: 'M4 5h16v14H4zM4 15l4-4 5 5 3-3 4 4M9 9h.01', a: false },
      { label: 'Settings', d: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4', a: false }
    ];
    const fl = (a) => 'display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; border-radius: 10px; border: 0; cursor: pointer; font-size: 14px; font-weight: ' + (a ? '600' : '500') + '; color: #ffffff; background: ' + (a ? '#1f2d3d' : 'transparent');
    const filters = [
      { label: 'All', count: '48', a: true },
      { label: 'Images', count: '31', a: false },
      { label: 'Videos', count: '17', a: false },
      { label: 'Favorites', count: '6', a: false }
    ].map((f) => ({ label: f.label, count: f.count, style: fl(f.a) }));
    const bases = [
      { bg: '#c9b79a', ring: '#7a6a52', center: '#3b3226', dot: '#00000000', dx: 50, dy: 50 },
      { bg: '#aeb9c6', ring: '#5a6675', center: '#1c232c', dot: '#00000000', dx: 50, dy: 50 },
      { bg: '#10151b', ring: '#e8eef5', center: '#e8eef5', dot: '#00000000', dx: 50, dy: 50, v: '0:10' },
      { bg: '#d8d2c4', ring: '#3d3a33', center: '#d94a3a', dot: '#1c232c', dx: 36, dy: 58 },
      { bg: '#f1efe9', ring: '#555555', center: '#d94a3a', dot: '#00000000', dx: 50, dy: 50 },
      { bg: '#2a3039', ring: '#c4ccd6', center: '#d94a3a', dot: '#ffffff', dx: 62, dy: 40, v: '0:10' }
    ];
    const orders = cap
      ? { i0: 1, i1: 2, i2: 3, t1: 4, t3: 5, t4: 6, t6: 7, t8: 8 }
      : { i0: 1, i1: 2, t1: 3, t3: 4 };
    const markers = { i0: 3, i1: 4, i2: 1, t1: 2, t3: 3, t4: 2, t6: 1, t8: 0 };
    const total = Object.keys(orders).length;
    const mk = (id, name, base, extra) => {
      const b = bases[base];
      const order = orders[id] || 0;
      const selected = order > 0;
      const dim = cap && !selected;
      const mcount = selected || id === 'i2' ? (markers[id] || 0) : 0;
      const wrap = 'position: relative; aspect-ratio: 1 / 1; border-radius: 10px; background: #243446;' + (selected ? ' outline: 2px solid #ffffff; outline-offset: 2px;' : '') + (dim ? ' opacity: 0.4;' : '');
      const dur = extra.dur || b.v || '';
      return {
        id, name, bg: b.bg, ring: b.ring, center: b.center, dot: b.dot, dx: b.dx, dy: b.dy,
        video: !!dur, duration: dur, order, selected, wrap,
        ariaSel: selected ? 'true' : 'false',
        hover: !!extra.hover, tip: !!extra.tip,
        srcComputer: extra.src === 'Computer', srcCamera: !!extra.src && extra.src !== 'Computer',
        markers: mcount, hasMarkers: mcount > 0,
        meta: (dur ? 'Video · ' + dur : 'Photo') + (extra.src ? ' · ' + extra.src : '') + (mcount > 0 ? ' · ' + mcount + (mcount === 1 ? ' marker' : ' markers') : '')
      };
    };
    const today = [
      mk('i0', 'IMG_2041', 2, { dur: '0:38', src: 'Computer' }),
      mk('i1', 'IMG_2044', 4, { src: 'Computer' }),
      mk('i2', 'CAM1_0607', 3, { src: 'Camera 1' })
    ];
    for (let i = 0; i < 9; i++) {
      today.push(mk('t' + i, 'IMG_' + (2050 + i), i % 6, { hover: !cap && i === 5, tip: cap && i === 9 }));
    }
    const yesterday = [];
    for (let i = 0; i < 9; i++) {
      yesterday.push(mk('y' + i, 'IMG_' + (2040 - i), (i + 2) % 6, { tip: cap && i === 2 }));
    }
    const earlier = [];
    for (let i = 0; i < 12; i++) {
      earlier.push(mk('e' + i, 'IMG_' + (2030 - i), (i + 4) % 6, {}));
    }
    const groups = [
      { title: 'Today', count: today.length, tiles: today },
      { title: 'Yesterday', count: yesterday.length, tiles: yesterday },
      { title: '10 Aug 2026', count: 27, tiles: earlier }
    ];
    const tray = today.filter((t) => t.selected).sort((a, b) => a.order - b.order);
    const slots = [];
    for (let i = 0; i < 8; i++) slots.push({ c: i < total ? '#ff5a1f' : '#2f4054' });
    return {
      nav: items.map((i) => ({ label: i.label, d: i.d, color: i.a ? '#ff5a1f' : '#8d9aab', style: btn(i.a) })),
      filters, groups, tray, slots,
      selCount: total,
      showToast: !cap
    };
  }
}
</script>
</body>
</html>
