<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview and Select, nothing selected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #121b26; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<nav aria-label="Primary" style="width: 72px; flex-shrink: 0; box-sizing: border-box; background: #0e1620; border-right: 1px solid #223142; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<button aria-label="{{n.label}}" title="{{n.label}}" style="{{n.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"/></svg>
</button>
</sc-for>
</nav>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #223142">
<a href="ChoosingV2.dc.html" aria-label="Back to Choose and Combine" title="Back (Esc)" style="width: 40px; height: 40px; border-radius: 50%; background: #1a2635; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div>
<div style="font-size: 12px; color: #8d9aab">Home / Target Studio</div>
<h1 style="margin: 2px 0 0; font-size: 20px; font-weight: 700">IMG_2044</h1>
</div>
</header>

<div style="flex: 1; min-height: 0; display: flex">

<section aria-label="Preview" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 20px 28px 24px; display: flex; flex-direction: column; align-items: center">
<div style="flex: 1; min-height: 0; width: 100%; border-radius: 14px; overflow: hidden; background: #0b1118">
<svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" style="display: block" role="img" aria-label="Paper target pinned to a wall, IMG_2044">
<defs>
<pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#9a9fa0" stroke-width="0.8"/></pattern>
</defs>
<rect width="640" height="480" fill="#8f9795"/>
<polygon points="170,14 478,6 490,452 190,470" fill="#d6d9d9"/>
<polygon points="170,14 478,6 490,452 190,470" fill="url(#grid)"/>
<circle cx="332" cy="238" r="150" fill="none" stroke="#6b7172" stroke-width="1.2"/>
<circle cx="332" cy="238" r="112" fill="none" stroke="#6b7172" stroke-width="1.2"/>
<circle cx="332" cy="238" r="76" fill="#2b2c2d"/>
<circle cx="332" cy="238" r="34" fill="#eceeee"/>
<path d="M332 168V308M262 238H402" stroke="#6b7172" stroke-width="1"/>
<circle cx="350" cy="232" r="3" fill="#202223"/>
<circle cx="362" cy="250" r="3" fill="#202223"/>
<circle cx="402" cy="240" r="3" fill="#202223"/>
<path d="M210 40l14-1M420 34l14-1M440 420l10-1M226 424l10-1" stroke="#202223" stroke-width="3" stroke-linecap="round"/>
</svg>
</div>

<div role="listbox" aria-label="Media" style="display: flex; gap: 10px; align-items: center; margin-top: 18px; padding: 4px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="10">
<button role="option" aria-selected="false" aria-label="{{t.label}}" style="{{t.style}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{t.bg}}"/><circle cx="50" cy="50" r="36" fill="none" stroke="{{t.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="20" fill="none" stroke="{{t.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="8" fill="{{t.center}}"/></svg>
</button>
</sc-for>
</div>
<div style="margin-top: 12px; font-size: 12px; color: #8d9aab">12 Aug 2026 · 2:32 PM · 2 of 24</div>
<div style="margin-top: 16px; display: flex; gap: 14px">
<button style="width: 220px; height: 48px; border-radius: 999px; border: 0; background: #ffffff; color: #121b26; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">SELECT</button>
<button disabled aria-describedby="why" style="width: 220px; height: 48px; border-radius: 999px; border: 0; background: #2a3645; color: #7d8a9a; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: not-allowed">REVIEW</button>
</div>
<div id="why" style="margin-top: 10px; font-size: 12px; color: #8d9aab">Select at least 1 item to review.</div>
</section>

<aside aria-label="Selection" style="width: 340px; flex-shrink: 0; box-sizing: border-box; border-left: 1px solid #223142; background: #0e1620; display: flex; flex-direction: column">
<div style="flex-shrink: 0; box-sizing: border-box; padding: 16px 20px 14px; display: flex; align-items: flex-start; justify-content: space-between">
<div>
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Selection</h2>
<div style="font-size: 12px; color: #8d9aab; margin-top: 1px">0 of 8</div>
<div style="display: flex; gap: 3px; margin-top: 8px" role="img" aria-label="0 of 8 slots used">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<span style="width: 14px; height: 5px; border-radius: 2px; background: #2f4054"></span>
</sc-for>
</div>
</div>
<button disabled style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #223142; background: transparent; color: #5d6c7e; font-size: 12px; font-weight: 600; cursor: not-allowed">Clear all</button>
</div>

<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 16px">
<div style="box-sizing: border-box; border-radius: 14px; border: 1px dashed #2c3b4d; padding: 36px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5d6c7e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01"/></svg>
<div style="font-size: 14px; font-weight: 600">Nothing selected yet</div>
<div style="font-size: 12px; line-height: 1.5; color: #8d9aab">Press Select to add this image. Viewing never selects it.</div>
</div>
</div>

<div style="flex-shrink: 0; box-sizing: border-box; padding: 16px; border-top: 1px solid #223142; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #8d9aab"><span>Select up to 8</span><span>Drag to reorder</span></div>
</div>
</aside>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const btn = (a) => 'width: 48px; height: 48px; border-radius: 12px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + (a ? '#1f2d3d' : 'transparent');
    const items = [
      { label: 'Home', d: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z', a: false },
      { label: 'Camera', d: 'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', a: false },
      { label: 'Target Studio', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01', a: true },
      { label: 'Library', d: 'M4 5h16v14H4zM4 15l4-4 5 5 3-3 4 4M9 9h.01', a: false },
      { label: 'Settings', d: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4', a: false }
    ];
    const bases = [
      { bg: '#c9b79a', ring: '#7a6a52', center: '#3b3226' },
      { bg: '#d9dcdc', ring: '#2b2c2d', center: '#eceeee' },
      { bg: '#10151b', ring: '#e8eef5', center: '#e8eef5' },
      { bg: '#d8d2c4', ring: '#3d3a33', center: '#d94a3a' },
      { bg: '#f1efe9', ring: '#555555', center: '#d94a3a' },
      { bg: '#aeb9c6', ring: '#5a6675', center: '#1c232c' },
      { bg: '#2a3039', ring: '#c4ccd6', center: '#d94a3a' }
    ];
    const cur = 1;
    const thumbs = [];
    for (let i = 0; i < 10; i++) {
      const b = bases[i % bases.length];
      const isCur = i === cur;
      thumbs.push({
        bg: b.bg, ring: b.ring, center: b.center,
        label: 'Item ' + (i + 1) + (isCur ? ', current' : ''),
        style: 'position: relative; width: 64px; height: 64px; padding: 0; border: 0; border-radius: 8px; overflow: hidden; cursor: pointer; flex-shrink: 0; background: #243446;' + (isCur ? ' box-shadow: 0 0 0 2px #121b26, 0 0 0 4px #ffffff;' : '')
      });
    }
    const slots = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({ i }));
    return {
      nav: items.map((i) => ({ label: i.label, d: i.d, color: i.a ? '#ff5a1f' : '#8d9aab', style: btn(i.a) })),
      thumbs, slots
    };
  }
}
</script>
</body>
</html>
