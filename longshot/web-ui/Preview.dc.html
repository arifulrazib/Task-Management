<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview and select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0b1118; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<section aria-label="Preview" style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 14px">
<button aria-label="Back to picker" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #1a2635; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<h1 style="margin: 0; font-size: 16px; font-weight: 600">{{fileName}}</h1>
</header>

<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 28px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="flex: 1; min-height: 0; position: relative; border-radius: 12px; overflow: hidden; background: #8f9795">
<svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="display: block" role="img" aria-label="Paper target on a wall">
<defs>
<pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#9a9fa0" stroke-width="0.8"/></pattern>
</defs>
<rect width="640" height="480" fill="#8f9795"/>
<polygon points="170,14 478,6 490,452 190,470" fill="#d6d9d9"/>
<polygon points="170,14 478,6 490,452 190,470" fill="url(#grid)"/>
<circle cx="332" cy="238" r="150" fill="none" stroke="#6b7172" stroke-width="1.2"/>
<circle cx="332" cy="238" r="112" fill="none" stroke="#6b7172" stroke-width="1.2"/>
<circle cx="332" cy="238" r="76" fill="#2b2c2d"/>
<circle cx="332" cy="238" r="34" fill="#eceeee"/>
<path d="M332 168V308M262 238H402" stroke="#6b7172" stroke-width="1"/>
<circle cx="350" cy="232" r="3" fill="#202223"/>
<circle cx="362" cy="250" r="3" fill="#202223"/>
<circle cx="402" cy="240" r="3" fill="#202223"/>
<path d="M210 40l14-1M420 34l14-1M440 420l10-1M226 424l10-1" stroke="#202223" stroke-width="3" stroke-linecap="round"/>
</svg>
</div>

<sc-if value="{{isVideo}}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; font-size: 12px; color: #c6d0dc">
<button aria-label="Play" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #1a2635; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"/></svg>
</button>
<span>00:00</span>
<div style="position: relative; flex: 1; height: 4px; border-radius: 2px; background: #2c3b4d"><span style="position: absolute; left: 0; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: #ffffff"></span></div>
<span>-00:10</span>
<button aria-label="Mute" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #1a2635; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6"/></svg>
</button>
</div>
</sc-if>
</div>
</section>

<aside aria-label="Selection" style="width: 392px; flex-shrink: 0; box-sizing: border-box; background: #0e1620; border-left: 1px solid #223142; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="font-size: 13px; color: #8d9aab; height: 40px; display: flex; align-items: center">12 Aug 2026 · 2:32 PM · 2 of 24</div>
<div role="listbox" aria-label="Media" style="flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 10px; align-content: start; padding: 4px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="24">
<button aria-label="{{t.label}}" style="{{t.style}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{t.bg}}"/><circle cx="50" cy="50" r="36" fill="none" stroke="{{t.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="20" fill="none" stroke="{{t.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="8" fill="{{t.center}}"/></svg>
<sc-if value="{{t.sel}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; border-radius: 50%; background: #ff5a1f; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
</sc-if>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button disabled="{{selectDisabled}}" style="{{selectStyle}}">{{selectLabel}}</button>
<button disabled="{{reviewDisabled}}" style="{{reviewStyle}}">{{reviewLabel}}</button>
</div>
</aside>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"none","options":["none","selected","unselected","cap","video"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'none';
    const sets = {
      none: [],
      selected: [1, 2, 4, 5],
      unselected: [2, 4, 5],
      cap: [0, 2, 3, 4, 5, 6, 7, 9],
      video: [2, 4, 5]
    };
    const sel = sets[v] || [];
    const cur = 1;
    const total = sel.length;
    const curSel = sel.indexOf(cur) >= 0;
    const bases = [
      { bg: '#c9b79a', ring: '#7a6a52', center: '#3b3226' },
      { bg: '#d9dcdc', ring: '#2b2c2d', center: '#eceeee' },
      { bg: '#10151b', ring: '#e8eef5', center: '#e8eef5' },
      { bg: '#d8d2c4', ring: '#3d3a33', center: '#d94a3a' },
      { bg: '#f1efe9', ring: '#555555', center: '#d94a3a' },
      { bg: '#aeb9c6', ring: '#5a6675', center: '#1c232c' },
      { bg: '#2a3039', ring: '#c4ccd6', center: '#d94a3a' }
    ];
    const thumbs = [];
    for (let i = 0; i < 24; i++) {
      const b = bases[i % bases.length];
      const isCur = i === cur;
      const isSel = sel.indexOf(i) >= 0;
      thumbs.push({
        bg: b.bg, ring: b.ring, center: b.center,
        sel: isSel,
        label: 'Item ' + (i + 1) + (isSel ? ', selected' : '') + (isCur ? ', current' : ''),
        style: 'position: relative; aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 8px; overflow: hidden; cursor: pointer; background: #243446;' + (isCur ? ' box-shadow: 0 0 0 2px #0e1620, 0 0 0 4px #ffffff;' : '')
      });
    }
    const pill = 'width: 100%; height: 48px; border-radius: 999px; border: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; ';
    const selectDisabled = v === 'cap' && !curSel;
    const reviewDisabled = total === 0;
    return {
      fileName: v === 'video' ? 'VID_2045' : 'IMG_2044',
      isVideo: v === 'video',
      thumbs,
      selectLabel: curSel ? 'DESELECT' : 'SELECT',
      selectDisabled,
      selectStyle: pill + (selectDisabled ? 'background: #2a3645; color: #7d8a9a; cursor: not-allowed' : 'background: #ffffff; color: #121b26; cursor: pointer'),
      reviewLabel: total ? 'REVIEW · ' + total : 'REVIEW',
      reviewDisabled,
      reviewStyle: pill + (reviewDisabled ? 'background: #2a3645; color: #7d8a9a; cursor: not-allowed' : 'background: #ff5a1f; color: #ffffff; cursor: pointer')
    };
  }
}
</script>
</body>
</html>
