<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: #04070b; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" style="{{sceneStyle}}" role="img" aria-label="Live view of a steel target with a paper bullseye">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5a1a"/><stop offset="1" stop-color="#5f9a2a"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fa845"/><stop offset="1" stop-color="#c9dc92"/></linearGradient>
<filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="plate"><path d="M452 150Q452 108 486 100H714Q748 108 748 150L758 330L940 372L972 620H228L260 372L442 330Z"/></clipPath>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<g filter="url(#blur)">
<sc-for list="{{blobs}}" as="b" hint-placeholder-count="80">
<circle cx="{{b.x}}" cy="{{b.y}}" r="{{b.r}}" fill="{{b.c}}" opacity="0.8"/>
</sc-for>
</g>
<rect x="0" y="560" width="1200" height="240" fill="url(#grass)"/>
<rect x="570" y="620" width="60" height="180" fill="#252b25"/>
<path d="M452 150Q452 108 486 100H714Q748 108 748 150L758 330L940 372L972 620H228L260 372L442 330Z" fill="#5c6f55" stroke="#3f4d3a" stroke-width="3"/>
<g clip-path="url(#plate)">
<sc-for list="{{holes}}" as="h" hint-placeholder-count="80">
<circle cx="{{h.x}}" cy="{{h.y}}" r="{{h.r}}" fill="#1d231c"/>
</sc-for>
</g>
<rect x="480" y="340" width="240" height="240" fill="#b6e01e"/>
<circle cx="600" cy="460" r="108" fill="#0b0c0b"/>
<circle cx="600" cy="460" r="86" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<circle cx="600" cy="460" r="64" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<circle cx="600" cy="460" r="42" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<circle cx="600" cy="460" r="22" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<path d="M600 352V568M492 460H708" stroke="#c6d21c" stroke-width="1.2"/>
<circle cx="600" cy="460" r="12" fill="#e0141c"/>
<circle cx="506" cy="364" r="12" fill="#e0141c"/><circle cx="526" cy="360" r="12" fill="#e0141c"/><circle cx="498" cy="386" r="12" fill="#e0141c"/>
<circle cx="672" cy="360" r="12" fill="#0b0c0b"/><circle cx="696" cy="366" r="12" fill="#0b0c0b"/><circle cx="702" cy="390" r="12" fill="#0b0c0b"/>
<circle cx="500" cy="534" r="12" fill="#0b0c0b"/><circle cx="512" cy="556" r="12" fill="#0b0c0b"/><circle cx="536" cy="560" r="12" fill="#0b0c0b"/>
<circle cx="698" cy="534" r="12" fill="#0b0c0b"/><circle cx="690" cy="556" r="12" fill="#0b0c0b"/><circle cx="666" cy="560" r="12" fill="#0b0c0b"/>
<sc-if value="{{showShots}}" hint-placeholder-val="{{ false }}">
<g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1">
<sc-for list="{{gridX}}" as="g" hint-placeholder-count="24">
<path d="M{{g}} 0V800"/>
</sc-for>
<sc-for list="{{gridY}}" as="g" hint-placeholder-count="16">
<path d="M0 {{g}}H1200"/>
</sc-for>
</g>
<sc-for list="{{markers}}" as="m" hint-placeholder-count="6">
<g>
<circle cx="{{m.x}}" cy="{{m.y}}" r="13" fill="#ff5a1f" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
<text x="{{m.x}}" y="{{m.ty}}" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">{{m.n}}</text>
</g>
</sc-for>
</sc-if>
</svg>

<div style="{{scrimStyle}}"></div>

<header style="{{headerStyle}}">
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Back" title="Back" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(8, 12, 18, 0.6); cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<div style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: rgba(8, 12, 18, 0.6); display: flex; align-items: center">
<img src="/_blob/a0585cbe772a5a5530d6307a2c67f8d5" alt="Longshot Target Camera" style="height: 26px; width: auto; display: block">
</div>
<div role="tablist" aria-label="Cameras" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(8, 12, 18, 0.6)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" aria-selected="{{t.selected}}" title="{{t.name}} (key {{t.key}})" style="{{t.style}}">{{t.name}}<span style="{{t.tagStyle}}">{{t.tag}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Measure" title="Measure" style="{{measureStyle}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v4H8v2H6v2H4zM8 4v2M6 4v1"/></svg>
</button>
<button aria-label="Selfie-Cam" title="Selfie-Cam" style="{{selfieStyle}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM7.5 17c.8-2 2.5-3 4.5-3s3.7 1 4.5 3"/></svg>
</button>
</div>
</header>

<sc-if value="{{showPip}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 28px; bottom: 28px; width: 224px; height: 126px; box-sizing: border-box; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.35); background: #2a3a4a; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5)">
<svg viewBox="0 0 224 126" width="100%" height="100%" style="display: block" role="img" aria-label="Selfie-Cam feed"><rect width="224" height="126" fill="#3a5068"/><rect y="80" width="224" height="46" fill="#4f6a52"/><circle cx="112" cy="52" r="20" fill="#c9a98a"/><path d="M62 126c4-30 24-42 50-42s46 12 50 42z" fill="#2b3138"/></svg>
<span style="position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(8, 12, 18, 0.75); font-size: 11px; font-weight: 600">Selfie-Cam</span>
</div>
</sc-if>

<div role="toolbar" aria-label="Workspace tools" style="{{toolbarStyle}}">
<button aria-label="Shot Blinker" title="Shot Blinker" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #3ddc84; cursor: pointer"></button>
<button aria-label="Undo" title="Undo (Ctrl+Z)" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>
</button>
<button aria-label="Snapshot" title="Snapshot" style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #ffffff; box-sizing: border-box; background: #ff5a1f; cursor: pointer"></button>
<button aria-label="Adjust" title="Adjust" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
</button>
<button aria-label="Gallery" title="Gallery" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h13v13H7zM4 8v12h12M10 13l3-3 4 4M12 8h.01"/></svg>
</button>
</div>

<sc-if value="{{showShots}}" hint-placeholder-val="{{ false }}">
<aside aria-label="Shots and measurements" style="position: absolute; right: 0; top: 0; bottom: 0; width: 340px; box-sizing: border-box; padding: 20px 16px; background: #0e1620; border-left: 1px solid #223142; display: flex; flex-direction: column; gap: 18px">
<section aria-labelledby="sh">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px">
<h2 id="sh" style="margin: 0; font-size: 16px; font-weight: 700">Shots</h2>
<span style="font-size: 12px; font-weight: 600; color: #ffb08f; background: rgba(255, 90, 31, 0.14); border-radius: 999px; padding: 3px 10px">6</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{markers}}" as="m" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; height: 38px; box-sizing: border-box; padding: 0 8px 0 10px; border-radius: 8px; background: #1a2635">
<span style="width: 22px; height: 22px; border-radius: 50%; background: #ff5a1f; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{m.n}}</span>
<span style="flex: 1; font-size: 13px; font-weight: 500">Shot {{m.n}}</span>
<button aria-label="Delete shot {{m.n}}" title="Delete (Del)" style="width: 26px; height: 26px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
</sc-for>
</div>
</section>

<section aria-label="Display">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8d9aab; margin-bottom: 8px">MARKER OPACITY</div>
<div style="position: relative; height: 4px; border-radius: 2px; background: #2c3b4d; margin: 12px 4px 16px"><span style="position: absolute; left: 0; top: 0; width: 80%; height: 4px; border-radius: 2px; background: #ff5a1f"></span><span style="position: absolute; left: 80%; top: -5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #ffffff"></span></div>
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8d9aab; margin-bottom: 8px">GRID OVERLAY</div>
<div role="radiogroup" aria-label="Grid overlay" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #1a2635">
<sc-for list="{{gridOpts}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.on}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</section>

<section aria-labelledby="ms" style="margin-top: auto; box-sizing: border-box; padding: 16px; border-radius: 14px; background: #1a2635">
<h2 id="ms" style="margin: 0 0 12px; font-size: 16px; font-weight: 700">Measurements</h2>
<div style="display: flex; flex-direction: column; gap: 12px; font-size: 13px">
<div style="display: flex; justify-content: space-between"><span style="color: #8d9aab">Group size</span><span style="font-weight: 600">1.18 MOA</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #8d9aab">Extreme spread</span><span style="font-weight: 600">1.42 MOA</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #8d9aab; white-space: nowrap">Adjustment to zero</span><span style="font-weight: 600; text-align: right">0.3 MOA left, 0.5 MOA up</span></div>
</div>
</section>
</aside>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"tabs","options":["tabs","shots"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'tabs';
    const shots = v === 'shots';
    const pr = shots ? 340 : 0;
    let s = 7;
    const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const greens = ['#3f7a1f', '#5c9a2a', '#7ab33a', '#2f6218', '#8cc24a', '#4d8a24'];
    const blobs = [];
    for (let i = 0; i < 90; i++) {
      blobs.push({ x: Math.round(rnd() * 1200), y: Math.round(rnd() * 560), r: Math.round(18 + rnd() * 54), c: greens[Math.floor(rnd() * greens.length)] });
    }
    const holes = [];
    for (let i = 0; i < 110; i++) {
      holes.push({ x: Math.round(230 + rnd() * 740), y: Math.round(105 + rnd() * 515), r: +(2 + rnd() * 4).toFixed(1) });
    }
    const gridX = [], gridY = [];
    for (let x = 0; x <= 1200; x += 50) gridX.push(x);
    for (let y = 0; y <= 800; y += 50) gridY.push(y);
    const pts = [[585, 448], [612, 470], [598, 484], [632, 452], [568, 472], [606, 434]];
    const markers = pts.map((p, i) => ({ x: p[0], y: p[1], ty: p[1] + 5, n: i + 1 }));
    const names = [{ n: 'Camera 1', t: '100 yd' }, { n: 'Camera 2', t: '200 yd' }, { n: 'Camera 3', t: '300 yd' }, { n: 'Camera 4', t: 'Lane 4' }];
    const activeIdx = shots ? 0 : 1;
    const tabs = names.map((c, i) => {
      const on = i === activeIdx;
      return {
        name: c.n, tag: c.t, key: i + 1,
        selected: on ? 'true' : 'false',
        style: 'height: 36px; padding: 0 14px; border-radius: 9px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; background: ' + (on ? '#ffffff' : 'transparent') + '; color: ' + (on ? '#121b26' : '#c6d0dc'),
        tagStyle: 'font-size: 11px; font-weight: 500; color: ' + (on ? '#5a6675' : '#8d9aab')
      };
    });
    const seg = (on) => 'flex: 1; height: 32px; border-radius: 7px; border: 0; cursor: pointer; font-size: 12px; font-weight: 600; color: ' + (on ? '#121b26' : '#c6d0dc') + '; background: ' + (on ? '#ffffff' : 'transparent');
    const ico = (on) => 'width: 40px; height: 40px; border-radius: 10px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + (on ? 'rgba(36, 52, 70, 0.95)' : 'rgba(8, 12, 18, 0.6)');
    return {
      blobs, holes, gridX, gridY, markers, tabs,
      showShots: shots, showPip: !shots,
      sceneStyle: 'position: absolute; top: 0; bottom: 0; left: 0; right: ' + pr + 'px; display: block',
      scrimStyle: 'position: absolute; left: 0; right: ' + pr + 'px; top: 0; height: 140px; background: linear-gradient(180deg, rgba(4, 7, 11, 0.72), rgba(4, 7, 11, 0))',
      headerStyle: 'position: absolute; left: 0; right: ' + pr + 'px; top: 0; box-sizing: border-box; padding: 24px 28px; display: flex; align-items: center; justify-content: space-between',
      toolbarStyle: 'position: absolute; left: calc(50% - ' + (pr / 2) + 'px); bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 999px; background: rgba(14, 22, 32, 0.82); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45)',
      measureStyle: ico(shots),
      selfieStyle: ico(!shots),
      gridOpts: [{ label: 'Off', on: 'false' }, { label: 'MOA', on: 'true' }, { label: 'MIL', on: 'false' }].map((o) => ({ label: o.label, on: o.on, style: seg(o.on === 'true') }))
    };
  }
}
</script>
</body>
</html>
