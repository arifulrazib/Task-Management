<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm the selected set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0a121b; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<nav aria-label="Primary" style="width: 72px; flex-shrink: 0; box-sizing: border-box; background: #0e1620; border-right: 1px solid #223142; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<button aria-label="{{n.label}}" title="{{n.label}}" style="{{n.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"/></svg>
</button>
</sc-for>
</nav>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 16px">
<a href="PreviewNoneV4.dc.html" aria-label="Back" title="Back (Esc)" style="width: 40px; height: 40px; border-radius: 50%; background: #1a2635; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div>
<div style="font-size: 12px; color: #8d9aab">Target Studio</div>
<h1 style="margin: 1px 0 0; font-size: 20px; font-weight: 700">Review selection</h1>
</div>
</header>

<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 24px 24px; display: flex; gap: 20px">

<section aria-label="Selected media" style="flex: 1; min-width: 0; border-radius: 16px; overflow: hidden; background: #020913">
<svg viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" style="display: block" role="img" aria-label="Close-up of a paper target with bullet holes">
<rect width="640" height="400" fill="#020913"/>
<rect x="0" y="60" width="640" height="280" fill="#dccdb1"/>
<g fill="none" stroke="#3a3326" stroke-width="1">
<circle cx="700" cy="250" r="420"/>
<circle cx="700" cy="250" r="330"/>
<circle cx="700" cy="250" r="240"/>
</g>
<circle cx="640" cy="230" r="120" fill="#1b1b1d"/>
<path d="M470 60V340" stroke="#4a4234" stroke-width="1.2"/>
<g font-family="Inter, sans-serif" font-size="34" fill="#2a2a2a">
<text x="150" y="270">3</text>
<text x="205" y="270">4</text>
<text x="395" y="300">6</text>
<text x="500" y="300" fill="#e9e6df">7</text>
</g>
<g fill="#1c1a17">
<path d="M170 170l12-10 10 8 6 12-8 10-14-2z"/>
<path d="M250 210l14-12 12 8 4 14-10 12-18-6z"/>
<circle cx="240" cy="258" r="20"/>
</g>
<g fill="#eef2f5">
<circle cx="318" cy="105" r="22"/>
<circle cx="326" cy="165" r="22"/>
<circle cx="322" cy="228" r="22"/>
<circle cx="238" cy="332" r="20"/>
</g>
<g font-family="Inter, sans-serif" font-style="italic" font-size="22" fill="#3a56a8">
<text x="186" y="205">44.6</text>
<text x="352" y="150">43.8</text>
</g>
</svg>
</section>

<aside aria-label="Selection" style="width: 360px; flex-shrink: 0; box-sizing: border-box; border-radius: 18px; background: #0e1620; border: 1px solid #223142; display: flex; flex-direction: column">
<div style="flex-shrink: 0; box-sizing: border-box; padding: 18px 20px 14px; border-bottom: 1px solid #223142">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Selection</h2>
<div style="font-size: 12px; color: #8d9aab; margin-top: 3px">1 of 4 selected · Computer</div>
</div>
<div role="listbox" aria-label="Selected media" style="flex: 1; min-height: 0; box-sizing: border-box; padding: 16px 16px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 10px; align-content: start">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="4">
<button role="option" aria-selected="{{t.sel}}" aria-label="{{t.label}}" style="{{t.style}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{t.bg}}"/><circle cx="50" cy="50" r="36" fill="none" stroke="{{t.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="20" fill="none" stroke="{{t.ring}}" stroke-width="3"/><circle cx="50" cy="50" r="8" fill="{{t.center}}"/></svg>
</button>
</sc-for>
</div>
<div style="flex-shrink: 0; box-sizing: border-box; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px">
<button title="Remove (Del)" style="height: 44px; border-radius: 999px; border: 0; background: #ffffff; color: #121b26; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">REMOVE</button>
<a href="Live.dc.html" style="height: 44px; border-radius: 999px; background: #ff5a1f; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.28)">CONTINUE</a>
</div>
</aside>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const btn = (a) => 'width: 48px; height: 48px; border-radius: 12px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + (a ? '#1f2d3d' : 'transparent');
    const items = [
      { label: 'Home', d: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z', a: false },
      { label: 'Camera', d: 'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', a: false },
      { label: 'Target Studio', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01', a: true },
      { label: 'Library', d: 'M4 5h16v14H4zM4 15l4-4 5 5 3-3 4 4M9 9h.01', a: false }
    ];
    const bases = [
      { bg: '#c9b79a', ring: '#7a6a52', center: '#3b3226' },
      { bg: '#d9dcdc', ring: '#2b2c2d', center: '#eceeee' },
      { bg: '#10151b', ring: '#e8eef5', center: '#e8eef5' },
      { bg: '#d8d2c4', ring: '#3d3a33', center: '#d94a3a' }
    ];
    const names = ['IMG_2041', 'IMG_2044', 'IMG_2051', 'IMG_2053'];
    const cur = 0;
    const thumbs = bases.map((b, i) => {
      const isCur = i === cur;
      return {
        bg: b.bg, ring: b.ring, center: b.center,
        sel: isCur ? 'true' : 'false',
        label: names[i] + (isCur ? ', current' : ''),
        style: 'position: relative; aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: pointer; background: #243446;' + (isCur ? ' outline: 2px solid #ffffff; outline-offset: 2px;' : '')
      };
    });
    return {
      nav: items.map((i) => ({ label: i.label, d: i.d, color: i.a ? '#ff5a1f' : '#8d9aab', style: btn(i.a) })),
      thumbs
    };
  }
}
</script>
</body>
</html>
