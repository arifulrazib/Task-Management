<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose and Combine with preview card, nothing selected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #121b26; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<nav aria-label="Primary" style="width: 72px; flex-shrink: 0; box-sizing: border-box; background: #0e1620; border-right: 1px solid #223142; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<button aria-label="{{n.label}}" title="{{n.label}}" style="{{n.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"/></svg>
</button>
</sc-for>
</nav>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #223142">
<a href="Main.dc.html" aria-label="Back to Home" style="width: 40px; height: 40px; border-radius: 50%; background: #1a2635; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div>
<div style="font-size: 12px; color: #8d9aab">Home / Target Studio</div>
<h1 style="margin: 2px 0 0; font-size: 20px; font-weight: 700">Choose &amp; Combine</h1>
</div>
</header>

<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 24px 28px 28px; display: flex; gap: 24px">

<section aria-label="Gallery" style="width: 580px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div role="tablist" aria-label="Library" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #1a2635">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button role="tab" aria-selected="{{f.sel}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<button style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #2c3b4d; background: transparent; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8d9aab" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
Camera
</button>
</div>
<h2 style="margin: 22px 0 12px; font-size: 14px; font-weight: 600; color: #c6d0dc">Today</h2>
<div role="listbox" aria-label="Media" style="flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 12px; align-content: start; padding: 3px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="16">
<button role="option" aria-selected="false" aria-label="{{t.label}}" style="{{t.style}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{t.bg}}"/><circle cx="50" cy="50" r="40" fill="none" stroke="{{t.ring}}" stroke-width="1.4"/><circle cx="50" cy="50" r="28" fill="none" stroke="{{t.ring}}" stroke-width="1.4"/><circle cx="50" cy="50" r="16" fill="none" stroke="{{t.ring}}" stroke-width="1.4"/><circle cx="50" cy="50" r="7" fill="{{t.center}}"/></svg>
<sc-if value="{{t.video}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 6px; bottom: 6px; padding: 2px 7px; border-radius: 6px; background: rgba(8, 12, 18, 0.85); font-size: 11px; font-weight: 500">0:10</span>
</sc-if>
</button>
</sc-for>
</div>
</section>

<section aria-label="Preview" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 22px; border-radius: 18px; background: #0e1620; border: 1px solid #223142; display: flex; flex-direction: column">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">IMG_2044</h2>
<div style="font-size: 13px; color: #8d9aab">12 Aug 2026 · 2:32 PM · 2 of 24</div>
</div>
<div style="flex: 1; min-height: 0; margin-top: 16px; display: flex; align-items: center; justify-content: center">
<div style="max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; height: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4)">
<svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="display: block" role="img" aria-label="Paper target pinned to a wall, IMG_2044">
<defs>
<pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#9a9fa0" stroke-width="0.8"/></pattern>
</defs>
<rect width="640" height="480" fill="#8f9795"/>
<polygon points="170,14 478,6 490,452 190,470" fill="#d6d9d9"/>
<polygon points="170,14 478,6 490,452 190,470" fill="url(#grid)"/>
<circle cx="332" cy="238" r="150" fill="none" stroke="#6b7172" stroke-width="1.2"/>
<circle cx="332" cy="238" r="112" fill="none" stroke="#6b7172" stroke-width="1.2"/>
<circle cx="332" cy="238" r="76" fill="#2b2c2d"/>
<circle cx="332" cy="238" r="34" fill="#eceeee"/>
<path d="M332 168V308M262 238H402" stroke="#6b7172" stroke-width="1"/>
<circle cx="350" cy="232" r="3" fill="#202223"/>
<circle cx="362" cy="250" r="3" fill="#202223"/>
<circle cx="402" cy="240" r="3" fill="#202223"/>
<path d="M210 40l14-1M420 34l14-1M440 420l10-1M226 424l10-1" stroke="#202223" stroke-width="3" stroke-linecap="round"/>
</svg>
</div>
</div>
<div style="margin-top: 18px; display: flex; align-items: center; justify-content: flex-end; gap: 12px">
<button title="Select (Space)" style="width: 170px; height: 46px; border-radius: 999px; border: 0; background: #ffffff; color: #121b26; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">SELECT</button>
<button disabled style="width: 170px; height: 46px; border-radius: 999px; border: 0; background: #2a3645; color: #7d8a9a; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: not-allowed">REVIEW</button>
</div>
</section>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const btn = (a) => 'width: 48px; height: 48px; border-radius: 12px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + (a ? '#1f2d3d' : 'transparent');
    const items = [
      { label: 'Home', d: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z', a: false },
      { label: 'Camera', d: 'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', a: false },
      { label: 'Target Studio', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01', a: true },
      { label: 'Library', d: 'M4 5h16v14H4zM4 15l4-4 5 5 3-3 4 4M9 9h.01', a: false },
      { label: 'Settings', d: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4', a: false }
    ];
    const tab = (a) => 'height: 32px; padding: 0 14px; border-radius: 9px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; color: ' + (a ? '#ffffff' : '#8d9aab') + '; background: ' + (a ? '#2a3b50' : 'transparent');
    const filters = [
      { label: 'All', a: true },
      { label: 'Images', a: false },
      { label: 'Videos', a: false },
      { label: 'Favorites', a: false }
    ].map((f) => ({ label: f.label, sel: f.a ? 'true' : 'false', style: tab(f.a) }));
    const bases = [
      { bg: '#c9b79a', ring: '#7a6a52', center: '#3b3226' },
      { bg: '#d9dcdc', ring: '#2b2c2d', center: '#eceeee' },
      { bg: '#10151b', ring: '#e8eef5', center: '#e8eef5', v: true },
      { bg: '#d8d2c4', ring: '#3d3a33', center: '#d94a3a' },
      { bg: '#f1efe9', ring: '#555555', center: '#d94a3a' },
      { bg: '#aeb9c6', ring: '#5a6675', center: '#1c232c' },
      { bg: '#2a3039', ring: '#c4ccd6', center: '#d94a3a', v: true }
    ];
    const cur = 1;
    const tiles = [];
    for (let i = 0; i < 20; i++) {
      const b = bases[i % bases.length];
      const isCur = i === cur;
      tiles.push({
        bg: b.bg, ring: b.ring, center: b.center, video: !!b.v,
        label: 'IMG_' + (2043 + i) + (isCur ? ', previewing' : ''),
        style: 'position: relative; aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: pointer; background: #243446;' + (isCur ? ' outline: 2px solid #ffffff; outline-offset: 2px;' : '')
      });
    }
    return {
      nav: items.map((i) => ({ label: i.label, d: i.d, color: i.a ? '#ff5a1f' : '#8d9aab', style: btn(i.a) })),
      filters, tiles
    };
  }
}
</script>
</body>
</html>
