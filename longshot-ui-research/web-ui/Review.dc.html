<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review and continue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0b1118; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<section aria-label="Review" style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 14px">
<button aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #1a2635; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<h1 style="margin: 0; font-size: 16px; font-weight: 600">Review selection</h1>
</header>

<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 28px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="flex: 1; min-height: 0; border-radius: 12px; overflow: hidden; background: #04070b">
<svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" style="display: block" role="img" aria-label="Selected media">
<rect x="0" y="0" width="640" height="480" fill="#04070b"/>
<rect x="0" y="40" width="640" height="400" fill="{{img.wall}}"/>
<polygon points="170,40 478,40 490,440 190,440" fill="{{img.paper}}"/>
<circle cx="332" cy="240" r="150" fill="none" stroke="{{img.line}}" stroke-width="1.4"/>
<circle cx="332" cy="240" r="112" fill="none" stroke="{{img.line}}" stroke-width="1.4"/>
<circle cx="332" cy="240" r="76" fill="{{img.disc}}" stroke="{{img.line}}" stroke-width="1.4"/>
<circle cx="332" cy="240" r="34" fill="{{img.center}}"/>
<circle cx="350" cy="232" r="3" fill="#202223"/>
<circle cx="362" cy="250" r="3" fill="#202223"/>
<circle cx="402" cy="240" r="3" fill="#202223"/>
</svg>
</div>

<sc-if value="{{isVideo}}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; font-size: 12px; color: #c6d0dc">
<button aria-label="Play" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #1a2635; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"/></svg>
</button>
<span>00:00</span>
<div style="position: relative; flex: 1; height: 4px; border-radius: 2px; background: #2c3b4d"><span style="position: absolute; left: 0; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: #ffffff"></span></div>
<span>-00:10</span>
<button aria-label="Mute" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #1a2635; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6"/></svg>
</button>
</div>
</sc-if>
</div>
</section>

<aside aria-label="Selected media" style="width: 392px; flex-shrink: 0; box-sizing: border-box; background: #0e1620; border-left: 1px solid #223142; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="font-size: 13px; color: #8d9aab; height: 40px; display: flex; align-items: center">{{meta}}</div>
<div role="listbox" aria-label="Selected media" style="flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 10px; align-content: start; padding: 4px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="4">
<button aria-label="{{t.label}}" style="{{t.style}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{t.wall}}"/><circle cx="50" cy="50" r="36" fill="none" stroke="{{t.line}}" stroke-width="3"/><circle cx="50" cy="50" r="20" fill="none" stroke="{{t.line}}" stroke-width="3"/><circle cx="50" cy="50" r="8" fill="{{t.center}}"/></svg>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button style="width: 100%; height: 48px; border-radius: 999px; border: 0; background: #ffffff; color: #121b26; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">REMOVE</button>
<button style="width: 100%; height: 48px; border-radius: 999px; border: 0; background: #ff5a1f; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">CONTINUE</button>
</div>
</aside>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"confirm","options":["confirm","remove","video"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'confirm';
    const A = { wall: '#b9a98c', paper: '#cdbb9d', line: '#6b5a40', disc: 'none', center: '#2b2c2d' };
    const B = { wall: '#9aa3ad', paper: '#c4ccd4', line: '#5a6675', disc: '#2b2c2d', center: '#e8eef5' };
    const C = { wall: '#0e141a', paper: '#161c22', line: '#c4ccd6', disc: 'none', center: '#e8eef5' };
    const D = { wall: '#c9b79a', paper: '#d8d2c4', line: '#3d3a33', disc: 'none', center: '#d94a3a' };
    const W = { wall: '#f4f4f2', paper: '#ffffff', line: '#555555', disc: 'none', center: '#d94a3a' };
    const V = { wall: '#8f9795', paper: '#d6d9d9', line: '#6b7172', disc: '#2b2c2d', center: '#eceeee' };
    const sets = {
      confirm: { items: [A, B, C, D], cur: 0, meta: '1 of 4 selected · Computer' },
      remove: { items: [W, B, C], cur: 0, meta: '1 of 3 selected · Computer' },
      video: { items: [A, B, V, D], cur: 2, meta: '3 of 4 selected · Camera 1' }
    };
    const s = sets[v] || sets.confirm;
    const thumbs = s.items.map((it, i) => ({
      wall: it.wall, line: it.line, center: it.center,
      label: 'Item ' + (i + 1) + (i === s.cur ? ', current' : ''),
      style: 'position: relative; aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 8px; overflow: hidden; cursor: pointer; background: #243446;' + (i === s.cur ? ' box-shadow: 0 0 0 2px #0e1620, 0 0 0 4px #ffffff;' : '')
    }));
    return { img: s.items[s.cur], isVideo: v === 'video', meta: s.meta, thumbs };
  }
}
</script>
</body>
</html>
