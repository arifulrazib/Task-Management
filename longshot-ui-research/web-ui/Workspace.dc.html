<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: #04070b; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" style="position: absolute; top: 0; bottom: 0; left: 0; right: {{pr}}px; display: block" role="img" aria-label="Photo of a steel target with a paper bullseye">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5a1a"/><stop offset="1" stop-color="#5f9a2a"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fa845"/><stop offset="1" stop-color="#c9dc92"/></linearGradient>
<filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="plate"><path d="M452 150Q452 108 486 100H714Q748 108 748 150L758 330L940 372L972 620H228L260 372L442 330Z"/></clipPath>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<g filter="url(#blur)">
<sc-for list="{{blobs}}" as="b" hint-placeholder-count="80">
<circle cx="{{b.x}}" cy="{{b.y}}" r="{{b.r}}" fill="{{b.c}}" opacity="0.8"/>
</sc-for>
</g>
<rect x="0" y="560" width="1200" height="240" fill="url(#grass)"/>
<rect x="570" y="620" width="60" height="180" fill="#252b25"/>
<path d="M452 150Q452 108 486 100H714Q748 108 748 150L758 330L940 372L972 620H228L260 372L442 330Z" fill="#5c6f55" stroke="#3f4d3a" stroke-width="3"/>
<g clip-path="url(#plate)">
<sc-for list="{{holes}}" as="h" hint-placeholder-count="80">
<circle cx="{{h.x}}" cy="{{h.y}}" r="{{h.r}}" fill="#1d231c"/>
</sc-for>
</g>
<rect x="480" y="340" width="240" height="240" fill="#b6e01e"/>
<circle cx="600" cy="460" r="108" fill="#0b0c0b"/>
<circle cx="600" cy="460" r="86" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<circle cx="600" cy="460" r="64" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<circle cx="600" cy="460" r="42" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<circle cx="600" cy="460" r="22" fill="none" stroke="#c6d21c" stroke-width="1.4"/>
<path d="M600 352V568M492 460H708" stroke="#c6d21c" stroke-width="1.2"/>
<circle cx="600" cy="460" r="12" fill="#e0141c"/>
<circle cx="506" cy="364" r="12" fill="#e0141c"/><circle cx="526" cy="360" r="12" fill="#e0141c"/><circle cx="498" cy="386" r="12" fill="#e0141c"/>
<circle cx="672" cy="360" r="12" fill="#0b0c0b"/><circle cx="696" cy="366" r="12" fill="#0b0c0b"/><circle cx="702" cy="390" r="12" fill="#0b0c0b"/>
<circle cx="500" cy="534" r="12" fill="#0b0c0b"/><circle cx="512" cy="556" r="12" fill="#0b0c0b"/><circle cx="536" cy="560" r="12" fill="#0b0c0b"/>
<circle cx="698" cy="534" r="12" fill="#0b0c0b"/><circle cx="690" cy="556" r="12" fill="#0b0c0b"/><circle cx="666" cy="560" r="12" fill="#0b0c0b"/>
</svg>

<div style="position: absolute; left: 0; right: {{pr}}px; top: 0; height: 140px; background: linear-gradient(180deg, rgba(4, 7, 11, 0.72), rgba(4, 7, 11, 0))"></div>

<header style="position: absolute; left: 0; right: {{pr}}px; top: 0; box-sizing: border-box; padding: 24px 28px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Back" title="Back" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(8, 12, 18, 0.6); cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<div style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: rgba(8, 12, 18, 0.6); display: flex; align-items: center">
<img src="/_blob/a0585cbe772a5a5530d6307a2c67f8d5" alt="Longshot Target Camera" style="height: 26px; width: auto; display: block">
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Measure" title="Measure" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: rgba(8, 12, 18, 0.6); cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v4H8v2H6v2H4zM8 4v2M6 4v1"/></svg>
</button>
<button aria-label="Switch media" aria-haspopup="menu" aria-expanded="{{expanded}}" title="Switch media" style="{{mediaStyle}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 16l4-4 5 5 3-3 4 4M9 9h.01"/></svg>
<sc-if value="{{showChevron}}" hint-placeholder-val="{{ true }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</sc-if>
</button>
</div>
</header>

<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Session media" style="position: absolute; right: 28px; top: 76px; width: 288px; box-sizing: border-box; padding: 8px; border-radius: 14px; background: #1a2635; border: 1px solid #2c3b4d; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="m" hint-placeholder-count="3">
<button role="menuitem" aria-current="{{m.current}}" style="{{m.style}}">
<div style="width: 48px; height: 48px; border-radius: 8px; overflow: hidden; flex-shrink: 0">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{m.bg}}"/><circle cx="50" cy="50" r="30" fill="{{m.disc}}" stroke="{{m.line}}" stroke-width="3"/><circle cx="50" cy="50" r="9" fill="{{m.center}}"/></svg>
</div>
<div style="min-width: 0">
<div style="font-size: 13px; font-weight: 600; color: #ffffff">{{m.name}}</div>
<div style="font-size: 12px; color: #8d9aab; margin-top: 2px">{{m.meta}}</div>
</div>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{panel}}" hint-placeholder-val="{{ false }}">
<aside aria-label="Session media" style="position: absolute; right: 0; top: 0; bottom: 0; width: 340px; box-sizing: border-box; padding: 20px 16px; background: #0e1620; border-left: 1px solid #223142; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{items}}" as="m" hint-placeholder-count="3">
<button aria-current="{{m.current}}" style="{{m.style}}">
<div style="width: 56px; height: 56px; border-radius: 8px; overflow: hidden; flex-shrink: 0">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{m.bg}}"/><circle cx="50" cy="50" r="30" fill="{{m.disc}}" stroke="{{m.line}}" stroke-width="3"/><circle cx="50" cy="50" r="9" fill="{{m.center}}"/></svg>
</div>
<div style="min-width: 0">
<div style="font-size: 14px; font-weight: 600; color: #ffffff">{{m.name}}</div>
<div style="font-size: 12px; color: #8d9aab; margin-top: 2px">{{m.meta}}</div>
</div>
</button>
</sc-for>
</aside>
</sc-if>

<sc-if value="{{rail}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Session media" style="position: absolute; left: 28px; top: 88px; box-sizing: border-box; width: 84px; padding: 10px; border-radius: 18px; background: rgba(14, 22, 32, 0.82); box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="m" hint-placeholder-count="3">
<button aria-label="{{m.name}}, {{m.meta}}" aria-current="{{m.current}}" style="{{m.railStyle}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display: block"><rect width="100" height="100" fill="{{m.bg}}"/><circle cx="50" cy="50" r="30" fill="{{m.disc}}" stroke="{{m.line}}" stroke-width="3"/><circle cx="50" cy="50" r="9" fill="{{m.center}}"/></svg>
<sc-if value="{{m.video}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 5px; background: rgba(8, 12, 18, 0.85); font-size: 10px; font-weight: 500">0:38</span>
</sc-if>
</button>
</sc-for>
</nav>
<div role="tooltip" style="position: absolute; left: 128px; top: 164px; padding: 8px 12px; border-radius: 10px; background: #1a2635; border: 1px solid #2c3b4d; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5)">
<div style="font-size: 13px; font-weight: 600">IMG_2050</div>
<div style="font-size: 12px; color: #8d9aab; margin-top: 2px">Photo · Computer</div>
</div>
</sc-if>

<div role="toolbar" aria-label="Workspace tools" style="position: absolute; left: calc(50% - {{half}}px); bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 999px; background: rgba(14, 22, 32, 0.82); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45)">
<button aria-label="Status" title="Status" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #3ddc84; cursor: pointer"></button>
<button aria-label="Reset" title="Reset" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>
</button>
<button aria-label="Measure shots" title="Measure shots" style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #ffffff; box-sizing: border-box; background: #ff5a1f; cursor: pointer"></button>
<button aria-label="Adjust" title="Adjust" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
</button>
<button aria-label="Gallery" title="Gallery" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h13v13H7zM4 8v12h12M10 13l3-3 4 4M12 8h.01"/></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":false},"rail":{"editor":"boolean","default":false},"panel":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const open = this.props.open === true || this.props.open === 'true';
    const rail = this.props.rail === true || this.props.rail === 'true';
    const panel = this.props.panel === true || this.props.panel === 'true';
    const active = open || rail || panel;
    let s = 7;
    const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const greens = ['#3f7a1f', '#5c9a2a', '#7ab33a', '#2f6218', '#8cc24a', '#4d8a24'];
    const blobs = [];
    for (let i = 0; i < 90; i++) {
      blobs.push({ x: Math.round(rnd() * 1200), y: Math.round(rnd() * 560), r: Math.round(18 + rnd() * 54), c: greens[Math.floor(rnd() * greens.length)] });
    }
    const holes = [];
    for (let i = 0; i < 110; i++) {
      holes.push({ x: Math.round(230 + rnd() * 740), y: Math.round(105 + rnd() * 515), r: +(2 + rnd() * 4).toFixed(1) });
    }
    const row = (cur) => 'display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 8px; border: 0; border-radius: 10px; text-align: left; cursor: pointer; background: ' + (cur ? '#243446' : 'transparent');
    const items = [
      { name: 'IMG_2044', meta: 'Photo · Longshot', cur: true, bg: '#4f8a2a', disc: '#0b0c0b', line: '#b6e01e', center: '#e0141c' },
      { name: 'IMG_2050', meta: 'Photo · Computer', cur: false, bg: '#aeb9c6', disc: '#2b2c2d', line: '#5a6675', center: '#e8eef5' },
      { name: 'IMG_2041', meta: 'Video · 0:38', cur: false, bg: '#c9ccd0', disc: '#10151b', line: '#3d3a33', center: '#10151b' }
    ].map((m) => ({
      name: m.name, meta: m.meta, bg: m.bg, disc: m.disc, line: m.line, center: m.center,
      current: m.cur ? 'true' : 'false', style: row(m.cur), video: m.meta.indexOf('Video') === 0,
      railStyle: 'position: relative; width: 64px; height: 64px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: pointer; background: #243446;' + (m.cur ? ' box-shadow: 0 0 0 2px #0e1620, 0 0 0 4px #ffffff;' : '')
    }));
    return {
      open: open ? 'true' : 'false',
      rail, panel,
      showChevron: !(rail || panel),
      pr: panel ? 340 : 0,
      half: panel ? 170 : 0,
      expanded: active ? 'true' : 'false',
      blobs, holes, items,
      mediaStyle: 'height: 40px; box-sizing: border-box; padding: 0 10px; border-radius: 10px; border: 0; cursor: pointer; display: flex; align-items: center; gap: 6px; background: ' + (active ? 'rgba(36, 52, 70, 0.95)' : 'rgba(8, 12, 18, 0.6)')
    };
  }
}
</script>
</body>
</html>
